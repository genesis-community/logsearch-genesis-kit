---
kit:
  features:
  - azure-blobstore
  - prometheus-monitoring
  - cf-integration
  - enhanced-curator

genesis:
  env: production-azure

params:
  base_domain: logs.azure.example.com
  elasticsearch_instances: 6
  logstash_instances: 4
  kibana_instances: 2
  elasticsearch_heap_size: "16g"
  logstash_heap_size: "4g"
  azure_storage_account: prodlogstorageacct
  azure_container: elasticsearch-snapshots
  cf_system_domain: system.cf.example.com
  cf_app_retention_days: 7
  cf_platform_retention_days: 30