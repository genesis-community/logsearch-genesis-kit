azs:
- name: z1
  cloud_properties:
    zone: us-central1-a
- name: z2
  cloud_properties:
    zone: us-central1-b
- name: z3
  cloud_properties:
    zone: us-central1-c

vm_types:
- name: default
  cloud_properties:
    machine_type: n1-standard-2
    root_disk_size_gb: 20
    root_disk_type: pd-standard
- name: small
  cloud_properties:
    machine_type: e2-small
    root_disk_size_gb: 10
    root_disk_type: pd-standard
- name: medium
  cloud_properties:
    machine_type: n1-standard-2
    root_disk_size_gb: 20
    root_disk_type: pd-standard
- name: large
  cloud_properties:
    machine_type: n1-standard-4
    root_disk_size_gb: 50
    root_disk_type: pd-ssd

disk_types:
- name: default
  disk_size: 20_000
  cloud_properties:
    type: pd-standard
- name: small
  disk_size: 10_000
  cloud_properties:
    type: pd-standard
- name: large
  disk_size: 100_000
  cloud_properties:
    type: pd-ssd

networks:
- name: default
  type: manual
  subnets:
  - range: 10.0.1.0/24
    gateway: 10.0.1.1
    azs: [z1]
    static: [10.0.1.10-10.0.1.30]
    cloud_properties:
      network_name: vpc-logsearch
      subnetwork_name: default-subnet
      tags: [logsearch, default]
- name: logsearch
  type: manual
  subnets:
  - range: 10.0.2.0/24
    gateway: 10.0.2.1
    azs: [z1, z2, z3]
    static: [10.0.2.10-10.0.2.50]
    cloud_properties:
      network_name: vpc-logsearch
      subnetwork_name: logsearch-subnet
      tags: [logsearch]

compilation:
  workers: 3
  reuse_compilation_vms: true
  az: z1
  vm_type: large
  network: default